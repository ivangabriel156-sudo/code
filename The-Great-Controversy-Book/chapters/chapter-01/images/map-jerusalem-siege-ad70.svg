<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 162" role="img" aria-label="Simplified map of Jerusalem during the Roman siege of AD 70">
  <!-- Units are millimetres at print size: font-size 5.2 = about 15pt. Simplified diagram, not to scale. -->
  <style>
    text { font-family: "Source Serif 4", Georgia, serif; font-size: 5.2px; fill: #26170f; }
    .place { font-weight: 700; }
    .hill { font-style: italic; fill: #4a0c19; }
    .on-dark { fill: #fdf9f0; font-weight: 700; }
  </style>
  <rect x="0.5" y="0.5" width="167" height="161" fill="#ecdfc6" stroke="#b48a35" stroke-width="1"/>
  <line x1="0.5" y1="150" x2="167.5" y2="150" stroke="#b48a35" stroke-width="0.6"/>

  <!-- Hills -->
  <ellipse cx="147" cy="74" rx="15" ry="42" fill="#d9c79b" stroke="#b9a06a" stroke-width="0.5"/>
  <ellipse cx="141" cy="15.5" rx="25.5" ry="10.5" fill="#d9c79b" stroke="#b9a06a" stroke-width="0.5"/>

  <!-- Kidron Valley -->
  <path d="M122,30 C119,55 125,95 119,140" fill="none" stroke="#8c7a52" stroke-width="1.2" stroke-dasharray="1 2.2" stroke-linecap="round"/>
  <text class="hill" text-anchor="middle" transform="translate(128.3,84) rotate(-90)">Kidron Valley</text>

  <!-- Roman siege wall (circumvallation) -->
  <polygon points="24,28 94,18 117,40 117,108 100,134 56,136 28,110 23,60" fill="none" stroke="#6b1325" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- City -->
  <polygon points="36,34 92,26 110,44 110,104 96,128 58,130 38,104 32,62" fill="#fdf9f0" stroke="#26170f" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M32,62 L82,60" fill="none" stroke="#26170f" stroke-width="0.7"/>
  <path d="M70,60 L72,129" fill="none" stroke="#26170f" stroke-width="0.5" stroke-dasharray="1.5 1.5"/>

  <!-- Temple and fortress -->
  <rect x="82" y="58" width="28" height="36" fill="#d6b871" stroke="#6b1325" stroke-width="0.9"/>
  <rect x="91" y="68" width="10" height="14" fill="#fdf9f0" stroke="#6b1325" stroke-width="0.6"/>
  <text class="place" text-anchor="middle" x="96" y="65.5">Temple</text>
  <rect x="82" y="49" width="11" height="9" fill="#6b1325"/>
  <text class="place" text-anchor="end" x="80" y="55.5">Antonia Fortress</text>

  <!-- Districts -->
  <text class="place" text-anchor="middle" x="62" y="44">New City</text>
  <rect x="36" y="72" width="7" height="10" fill="#b48a35" stroke="#26170f" stroke-width="0.5"/>
  <text x="45.5" y="76">Herod’s</text>
  <text x="45.5" y="83.4">Palace</text>
  <text class="place" text-anchor="middle" x="57" y="102">Upper City</text>
  <text class="place" text-anchor="middle" x="90" y="112">Lower City</text>

  <!-- Hill labels and Roman camps -->
  <text class="hill" text-anchor="middle" x="147" y="50">Mount</text>
  <text class="hill" text-anchor="middle" x="147" y="57.4">of Olives</text>
  <rect x="144" y="64" width="6" height="6" fill="#6b1325"/>
  <text text-anchor="middle" x="147" y="77">10th</text>
  <text text-anchor="middle" x="147" y="84.4">Legion</text>
  <rect x="118.5" y="11.5" width="6" height="6" fill="#6b1325"/>
  <text class="hill" text-anchor="start" x="127" y="13.5">Mount Scopus</text>
  <text text-anchor="start" x="127" y="20.9">Titus’s camp</text>

  <!-- Compass -->
  <line x1="12" y1="27" x2="12" y2="14" stroke="#6b1325" stroke-width="0.9"/>
  <polygon points="12,11 9.6,16 14.4,16" fill="#6b1325"/>
  <text class="place" text-anchor="middle" x="12" y="9">N</text>

  <!-- Way of escape -->
  <text class="hill" text-anchor="end" x="156" y="146">East to the Jordan River and Pella</text>
  <line x1="157.5" y1="144.4" x2="163" y2="144.4" stroke="#4a0c19" stroke-width="0.8"/>
  <polygon points="165,144.4 162,142.6 162,146.2" fill="#4a0c19"/>

  <!-- Legend -->
  <line x1="6" y1="156" x2="16" y2="156" stroke="#26170f" stroke-width="1.3"/>
  <text x="19" y="157.6">City wall</text>
  <line x1="48" y1="156" x2="58" y2="156" stroke="#6b1325" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="61" y="157.6">Roman siege wall</text>
  <rect x="113" y="153.2" width="5.6" height="5.6" fill="#6b1325"/>
  <text x="121.5" y="157.6">Roman camp</text>
</svg>
